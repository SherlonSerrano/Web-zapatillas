<div class="flex items-end justify-between gap-3 mb-6">
    <div>
        <h1 class="text-3xl font-black text-neutral-900">Nuestros productos</h1>
        <p class="text-neutral-500 mt-1">Explora nuestra selección y encuentra tu próximo par favorito.</p>
    </div>
    <!-- Solo en celular: muestra u oculta el formulario de filtros -->
    <button type="button" id="btn-toggle-filtros" aria-expanded="false" aria-controls="form-filtros"
        class="md:hidden shrink-0 px-4 py-2 rounded-full bg-neutral-900 text-white text-sm font-semibold hover:bg-lime-500 hover:text-neutral-900 transition">
        Filtros
    </button>
</div>

<!-- Formulario de filtros (REQ 4: se envía con fetch POST, sin recargar) -->
<form id="form-filtros" class="hidden md:block bg-white rounded-2xl shadow-sm p-4 mb-4" aria-label="Filtros de productos">
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div>
            <label for="nombre" class="block text-xs font-bold text-neutral-600 mb-1">Nombre</label>
            <input type="text" id="nombre" name="nombre" maxlength="150" placeholder="Ej: Air Force" autocomplete="off"
                class="w-full border border-neutral-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-lime-400">
        </div>

        <div>
            <label for="marca" class="block text-xs font-bold text-neutral-600 mb-1">Marca</label>
            <select id="marca" name="marca"
                class="w-full border border-neutral-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-lime-400">
                <option value="">Todas</option>
                <!-- Opciones cargadas desde la API por product.js -->
            </select>
        </div>

        <div>
            <label for="categoria_id" class="block text-xs font-bold text-neutral-600 mb-1">Categoría</label>
            <select id="categoria_id" name="categoria_id"
                class="w-full border border-neutral-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-lime-400">
                <option value="">Todas</option>
                <!-- Opciones cargadas desde la API por product.js -->
            </select>
        </div>

        <div>
            <label for="precio_min" class="block text-xs font-bold text-neutral-600 mb-1">Precio mínimo</label>
            <input type="number" id="precio_min" name="precio_min" min="0" step="0.01" placeholder="0" inputmode="decimal"
                class="w-full border border-neutral-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-lime-400">
        </div>

        <div>
            <label for="precio_max" class="block text-xs font-bold text-neutral-600 mb-1">Precio máximo</label>
            <input type="number" id="precio_max" name="precio_max" min="0" step="0.01" placeholder="1000" inputmode="decimal"
                class="w-full border border-neutral-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-lime-400">
        </div>

        <div>
            <label for="stock_min" class="block text-xs font-bold text-neutral-600 mb-1">Stock mínimo</label>
            <input type="number" id="stock_min" name="stock_min" min="0" step="1" placeholder="0" inputmode="numeric"
                class="w-full border border-neutral-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-lime-400">
        </div>
    </div>

    <!-- Errores de validación devueltos por filtrar.php (422) -->
    <div id="errores-filtros" role="alert" class="hidden mt-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3"></div>

    <div class="flex justify-end gap-2 mt-4">
        <button type="button" id="btn-limpiar"
            class="px-5 py-2 rounded-full bg-neutral-200 text-neutral-700 text-sm font-semibold hover:bg-neutral-300 transition">
            Limpiar
        </button>
        <button type="submit"
            class="px-5 py-2 rounded-full bg-neutral-900 text-white text-sm font-semibold hover:bg-lime-500 hover:text-neutral-900 transition">
            Filtrar
        </button>
    </div>
</form>

<!-- Resultados: contador, filtros aplicados y orden -->
<div class="flex flex-wrap items-center justify-between gap-3 mb-4">
    <div class="flex flex-wrap items-center gap-2 min-w-0">
        <p id="total-products" class="text-sm text-neutral-500" aria-live="polite"></p>
        <div id="chips-filtros" class="flex flex-wrap gap-2"></div>
    </div>

    <div class="flex items-center gap-2">
        <label for="orden" class="text-xs font-bold text-neutral-600">Ordenar por</label>
        <select id="orden"
            class="border border-neutral-300 rounded-lg px-3 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-lime-400">
            <option value="">Destacados</option>
            <option value="precio_asc">Precio: menor a mayor</option>
            <option value="precio_desc">Precio: mayor a menor</option>
            <option value="nombre">Nombre (A-Z)</option>
            <option value="stock_desc">Mayor stock</option>
        </select>
    </div>
</div>

<div id="grid-products" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-5">
    <!-- Tarjetas inyectadas por product.js -->
</div>

<!-- Modal detalle producto (REQ 2) -->
<div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4"
    role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="pop-in bg-white rounded-2xl w-full max-w-3xl max-h-[90vh] shadow-2xl overflow-hidden flex flex-col">
        <div class="flex justify-between items-center px-5 py-4 border-b">
            <h2 id="modal-titulo" class="text-lg font-bold text-neutral-900">Detalle del producto</h2>
            <button type="button" data-cerrar aria-label="Cerrar"
                class="text-neutral-400 hover:text-neutral-800 text-3xl leading-none">&times;</button>
        </div>
        <div id="div_product" class="px-5 py-5 overflow-y-auto">
            <!-- Detalle inyectado por product.js -->
        </div>
        <div class="flex justify-end gap-2 px-5 py-4 border-t bg-neutral-50">
            <button type="button" data-cerrar
                class="px-5 py-2 rounded-full bg-neutral-900 text-white font-semibold hover:bg-lime-500 hover:text-neutral-900 transition">
                Cerrar
            </button>
        </div>
    </div>
</div>
