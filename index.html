<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SneakHub: encuentra zapatillas Nike, adidas, Jordan, Converse y New Balance al mejor precio.">
    <title>SneakHub | Tienda de zapatillas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%9F%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Efecto de carga (skeleton) mientras llegan los datos de la API */
        .skeleton {
            background: linear-gradient(90deg, #e5e5e5 25%, #f5f5f5 50%, #e5e5e5 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite linear;
        }
        @keyframes shimmer { from { background-position: 200% 0 } to { background-position: -200% 0 } }

        /* Entrada suave de tarjetas y modal */
        .fade-up { animation: fadeUp .35s ease both; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
        .pop-in { animation: popIn .2s ease both; }
        @keyframes popIn { from { opacity: 0; transform: scale(.97) } to { opacity: 1; transform: none } }

        @media (prefers-reduced-motion: reduce) {
            .skeleton, .fade-up, .pop-in { animation: none; }
        }
    </style>
</head>
<body class="bg-neutral-100 text-neutral-800 min-h-screen flex flex-col antialiased">

    <a href="#div_content" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 bg-lime-400 text-neutral-900 px-3 py-2 rounded-lg font-semibold">
        Saltar al contenido
    </a>

    <!-- Navbar horizontal -->
    <header class="bg-neutral-900 text-white sticky top-0 z-40 shadow-lg">
        <div class="max-w-6xl mx-auto flex items-center justify-between px-4 sm:px-6 py-3">
            <a href="#" data-ir-home class="flex items-center gap-2" aria-label="SneakHub, ir al inicio">
                <span class="text-2xl" aria-hidden="true">👟</span>
                <span class="text-xl font-black tracking-tight">Sneak<span class="text-lime-400">Hub</span></span>
            </a>

            <nav class="flex items-center gap-1 sm:gap-2" aria-label="Menú principal">
                <a href="#" id="menu-home"
                    class="menu-link px-3 sm:px-4 py-2 rounded-full text-sm font-semibold bg-lime-400 text-neutral-900 transition"
                    aria-current="page">
                    Inicio
                </a>
                <a href="#" id="menu-product"
                    class="menu-link px-3 sm:px-4 py-2 rounded-full text-sm font-semibold hover:bg-neutral-700 transition">
                    Productos
                </a>
            </nav>
        </div>
    </header>

    <!-- Contenido dinámico -->
    <main class="flex-1">
        <div id="div_content" class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
            <!-- Aquí se inyecta home.html o view_product.html -->
        </div>
    </main>

    <footer class="bg-neutral-900 text-neutral-400 text-center text-sm py-5">
        Proyecto académico 2026 · <span class="text-white font-semibold">Sneak<span class="text-lime-400">Hub</span></span>
    </footer>

    <script>
        // Resalta el botón del menú activo
        function marcarMenuActivo(idActivo) {
            document.querySelectorAll('.menu-link').forEach(el => {
                el.classList.remove('bg-lime-400', 'text-neutral-900')
                el.classList.add('hover:bg-neutral-700')
                el.removeAttribute('aria-current')
            })
            const activo = document.getElementById(idActivo)
            activo.classList.add('bg-lime-400', 'text-neutral-900')
            activo.classList.remove('hover:bg-neutral-700')
            activo.setAttribute('aria-current', 'page')
        }
    </script>

    <script src="js/script.js"></script>
</body>
</html>
